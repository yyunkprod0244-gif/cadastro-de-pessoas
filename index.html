<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes P | CRUD com CrudCrud</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Cena 3D de fundo -->
  <div class="scene" id="scene" aria-hidden="true">
    <div class="world" id="world">
      <div class="cube c1"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="cube c2"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="cube c3"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="cube c4"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="cube c5"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="ring r1"></div>
      <div class="ring r2"></div>
    </div>
  </div>

  <header class="topbar">
    <span class="brand">Clientes<b>P</b></span>
    <button id="themeToggle" class="btn btn-ghost" type="button" aria-label="Alternar tema">
      <span id="themeIcon">🌙</span>
      <span id="themeLabel">Tema escuro</span>
    </button>
  </header>

  <main class="layout">
    <section class="panel tilt" id="formPanel">
      <h1>Cadastrar cliente</h1>
      <p class="subtitle">Os dados são salvos na API do CrudCrud.</p>

      <form id="clientForm" novalidate>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Ex.: Maria Silva" autocomplete="off" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="maria@email.com" autocomplete="off" required>

        <button type="submit" class="btn btn-primary" id="saveBtn">Salvar cliente</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section class="panel tilt" id="listPanel">
      <div class="list-head">
        <h2>Clientes cadastrados</h2>
        <span class="badge" id="counter">0</span>
      </div>
      <ul id="clientList" class="client-list"></ul>
      <p id="emptyState" class="empty" hidden>Nenhum cliente cadastrado ainda.</p>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 Douglas Henrique  - Todos os direitos reservados</p>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
